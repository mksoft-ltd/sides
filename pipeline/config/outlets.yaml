# Outlet pool for Sides: The News, Every Angle.
#
# One entry per outlet. Fields:
#   id            stable slug used in article ids and the digest (never rename once shipped)
#   name          display name
#   feed_url      public RSS/Atom feed (top stories / world preferred; English-language only)
#   home_url      link for the outlet record in the app
#   lean          left | centre | right | null  — null is mandatory for state-controlled outlets,
#                 otherwise null needs a lean_note explaining why no left/right tag is applied
#   region        uk | us | europe | middle_east | asia | africa | oceania | americas
#   bloc          west | east  (the West/East axis the founder asked for, 14 Oct 2026)
#   ownership     independent | public-service | state-funded | state-controlled
#   country       ISO-ish country name
#   rating_basis  which public rating the lean tag comes from, with a date, or why there is none
#   enabled       default true; false keeps the outlet on record but the collector skips it
#   note          free text (why disabled, caveats)
#
# Excluded on purpose: RT, Sputnik, Press TV (UK-sanctioned; store takedown risk).
# Feed URLs were verified live on 14 Oct 2026; see CLAUDE.md "How to add an outlet".

