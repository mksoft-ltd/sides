name: sides
description: "Sides: The News, Every Angle. A daily digest of how outlets across the political spectrum, and from West and East, cover the same stories."
publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  # Ads + the one-time ad-free unlock (native plugin only, house-facts §9).
  # Pinned: 9.1.0's ad-preloader headers include a private, non-modular SDK
  # header and the iOS Runner fails to import the module
  # (-Wnon-modular-include-in-framework-module). 9.0.0 matches food_score.
  google_mobile_ads: 9.0.0
  in_app_purchase: ^3.3.1
  # Direct, not just transitive: the purchase controller type-guards on
  # GooglePlayPurchaseDetails to tell a pending Play order from a paid one.
  in_app_purchase_android: ^0.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # google_mobile_ads is CocoaPods-only; with Flutter 3.44's SPM default the
  # pod install fails (house-facts §21). Per-project switch, never the global
  # `flutter config` flag. The documented `disable-swift-package-manager` key
  # is rejected by the tool.
  config:
    enable-swift-package-manager: false

  assets:
    # The real 14 Oct 2026 pipeline digest. Test fixture and debug/screenshot
    # preview only (guarded by !kReleaseMode); never shown as live content.
    - assets/sample_digest.json

# App icon. Sources + regeneration recipe: store_assets/icon/ (build_icon.py) and
# store_assets/README.md. After `dart run flutter_launcher_icons`, revert the
# pbxproj line the package corrupts (see the README).
flutter_launcher_icons:
  image_path: "store_assets/icon/icon_master.png"
  android: true
  ios: true
  # iOS rejects an app icon with an alpha channel; the master is opaque anyway.
  remove_alpha_ios: true
  adaptive_icon_background: "#15252C"
  adaptive_icon_foreground: "store_assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "store_assets/icon/icon_monochrome.png"
  min_sdk_android: 21
